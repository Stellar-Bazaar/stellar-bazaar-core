name: Soroban Lifecycle Simulation

on:
  push:
    paths:
      - 'contracts/**'
      - 'bazaar_math/**'
      - 'scripts/simulate_*'
      - '.github/workflows/simulate.yml'
    branches: [main]
  pull_request:
    paths:
      - 'contracts/**'
      - 'bazaar_math/**'
      - 'scripts/simulate_*'
      - '.github/workflows/simulate.yml'
    branches: [main]

jobs:
  simulate-e2e:
    name: Execute Soroban Cooperative & Dispute Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sim-${{ hashFiles('**/Cargo.lock') }}

      - name: Run E2E Cooperative Lifecycle Test Suite
        run: cargo test -p bazaar-deal-engine -- e2e_tests --nocapture

      - name: Run Dispute Lifecycle Test Suite
        run: cargo test -p bazaar-deal-engine -- dispute --nocapture

      - name: Execute POSIX Simulation Runner Script
        run: |
          chmod +x scripts/simulate_e2e_cooperative_lifecycle.sh
          ./scripts/simulate_e2e_cooperative_lifecycle.sh

