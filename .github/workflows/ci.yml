name: Stellar Bazaar Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-and-backend:
    name: Contracts, Indexer & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Soroban Contracts to WebAssembly
        run: |
          cargo rustc -p demand-circle-registry --target wasm32-unknown-unknown --release --crate-type=cdylib
          cargo rustc -p bazaar-deal-engine --target wasm32-unknown-unknown --release --crate-type=cdylib

      - name: Validate Contract Artifact Sizes & Enforce Budget
        run: |
          echo "Checking compiled WASM contract sizes..."
          MAX_BYTES=262144 # 256 KB Soroban deployable budget
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              SIZE=$(wc -c < "$wasm")
              NAME=$(basename "$wasm")
              echo "Contract $NAME: $SIZE bytes (Budget: $MAX_BYTES bytes)"
              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "Error: Contract $NAME ($SIZE bytes) exceeds Soroban budget of $MAX_BYTES bytes!"
                exit 1
              fi
            fi
          done
          echo "All compiled Soroban contracts within size budget."

      - name: Security Vulnerability Audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --ignore RUSTSEC-2020-0071 || true

  sdk-tests:
    name: SDK Validation & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'packages/sdk/package.json'

      - name: Install SDK Dependencies
        working-directory: packages/sdk
        run: npm ci || npm install

      - name: Run SDK Typecheck
        working-directory: packages/sdk
        run: npx tsc --noEmit

      - name: Run SDK Unit Tests
        working-directory: packages/sdk
        run: npx vitest run

  markdown-lint-and-links:
    name: Markdown Documentation Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Markdown Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'no'
          config-file: '.github/mlc_config.json'
